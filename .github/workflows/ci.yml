name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:

  test:
    name: Run Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          pytest tests/


  terraform-validate:
    name: Validate Terraform

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/aws
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/aws
        run: terraform validate


  cloudformation-validate:
    name: Validate CloudFormation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint

      - name: Validate CloudFormation templates
        run: |
          cfn-lint cloudformation/network/network.yaml
          cfn-lint cloudformation/ec2/ec2.yaml


  kubernetes-validate:
    name: Validate Kubernetes Manifests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$PWD:/workdir" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            /workdir/k8s/*.yaml


  docker-build:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs:
      - test
      - terraform-validate
      - cloudformation-validate
      - kubernetes-validate

    steps:

      - name: Checkout main branch
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Checkout GitOps branch
        uses: actions/checkout@v6
        with:
          ref: gitops
          path: gitops
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kubernetes image
        run: |
          sed -i "s|image: ghcr.io/mayankbishtt/ai-self-healing-devops-platform:.*|image: ghcr.io/mayankbishtt/ai-self-healing-devops-platform:${{ github.sha }}|" gitops/k8s/deployment.yaml

      - name: Commit and push GitOps changes
        run: |
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C gitops add k8s/deployment.yaml

          git -C gitops diff --cached --quiet || \
            git -C gitops commit -m "Update image to ${{ github.sha }} [skip ci]"

          git -C gitops push origin HEAD:gitops