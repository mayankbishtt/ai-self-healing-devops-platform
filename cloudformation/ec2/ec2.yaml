AWSTemplateFormatVersion: '2010-09-09'

Description: >
  EC2 instance for the AI Self-Healing DevOps Platform.

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the EC2 instance.

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet for the EC2 instance.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the EC2 instance.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name.

  AMIId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI.

  InstanceType:
    Type: String
    Default: t3.micro

    AllowedValues:
      - t3.micro
      - t3.small

    Description: EC2 instance type.

Resources:

  DevOpsEC2Instance:
    Type: AWS::EC2::Instance

    Properties:

      ImageId: !Ref AMIId

      InstanceType: !Ref InstanceType

      SubnetId: !Ref PublicSubnetId

      SecurityGroupIds:
        - !Ref SecurityGroupId

      KeyName: !Ref KeyName

      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true

      Tags:
        - Key: Name
          Value: ai-devops-ec2

      UserData:
        Fn::Base64: |
          #!/bin/bash

          dnf update -y

          dnf install -y docker git

          systemctl enable docker
          systemctl start docker

          usermod -aG docker ec2-user

Outputs:

  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref DevOpsEC2Instance

  PublicIp:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt DevOpsEC2Instance.PublicIp

  PublicDnsName:
    Description: Public DNS name
    Value: !GetAtt DevOpsEC2Instance.PublicDnsName

  PrivateIp:
    Description: Private IP address
    Value: !GetAtt DevOpsEC2Instance.PrivateIp